#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

# Automatically syncs with kitty's active theme (toge-light / toge-dark)
[palettes]
  template = '{{ if contains "light" (readFile (printf "%s/dotfiles/kitty/active-look.conf" .Env.HOME)) }}light{{ else }}dark{{ end }}'

  [palettes.list.dark]
    bg      = '#1a1919'
    bg_dark = '#121212'
    fg      = '#e8dcc4'
    green   = '#4d9375'
    entity  = '#98bb6c'
    blue    = '#6394bf'
    orange  = '#d4976c'
    red     = '#cb7676'
    yellow  = '#e6cc77'
    cyan    = '#5eaab5'
    pink    = '#d9739f'
    prompt  = '#e9dbb4'

  [palettes.list.light]
    bg      = '#e9dbb4'
    bg_dark = '#d9c898'
    fg      = '#231e18'
    green   = '#3a6b4a'
    entity  = '#3d6a3a'
    blue    = '#2b4f7a'
    orange  = '#9a5420'
    red     = '#a02f25'
    yellow  = '#7a5a0c'
    cyan    = '#2a6670'
    pink    = '#8f3a5c'
    prompt  = '#231e18'

[secondary_prompt]
  template = '❯❯ '
  foreground = 'p:prompt'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:prompt{{end}}']

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = false

  [[blocks.segments]]
    template = "{{ if .Segments.Git.HEAD }}<p:bg_dark,transparent>\ue0b6</>{{ end }} {{ .Path }} "
    foreground = 'p:entity'
    background = 'transparent'
    background_templates = ['{{ if .Segments.Git.HEAD }}p:bg_dark{{ end }}']
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'full'

  [[blocks.segments]]
    template = " \ue0a0 {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}{{ end }} <p:bg>{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>"
    foreground = 'p:bg'
    background = 'p:orange'
    type = 'git'
    # style = 'diamond'
    style = 'powerline'
    # leading_diamond = "\ue0d6"
    # trailing_diamond = "\ue0d6"
    powerline_symbol = "\ue0b0"
    [blocks.segments.properties]
      branch_icon = ''
      cache_duration = 'none'
      commit_icon = '@'
      fetch_status = true

[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    template = '{{ .FormattedMs }}'
    foreground = 'p:yellow'
    background = 'transparent'
    type = 'executiontime'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      threshold = 5000

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' 愛'
    background = 'transparent'
    type = 'text'
    style = 'plain'
    foreground_templates = ['{{if gt .Code 0}}p:red{{end}}', '{{if eq .Code 0}}p:prompt{{end}}']

    [blocks.segments.properties]
      cache_duration = 'none'
