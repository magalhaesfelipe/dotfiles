#
# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        0 10 10 10
hide_window_decorations     no
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
transparent_background_colors #010101@0.9
# Animated cursor follows text
cursor_trail 1
# selection_foreground        none
# selection_background        none
# Include wallpaper colors
# include colors-matugen.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
include $HOME/.config/kitty/custom.conf

# Theme
include current-theme.conf

#Tab bar
tab_bar_margin_height 0.0 0.0
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_title_template " {index} {title} "
tab_bar_background none

# KEYBINDINGS
map ctrl+backspace send_text all \x1b\x7f
map ctrl+a combine : select_all : copy_
map ctrl+backspace send_text all \x1b\x7f
map ctrl+a combine : select_all : copy_to_clipboard


