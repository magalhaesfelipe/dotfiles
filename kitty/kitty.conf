#
# Configuration
font_family                 JetBrains Mono Light
# font_family                 family="JetBrainsMono Nerd Font" style=Normal
font_size                   11.9
# bold_font                   family="JetBrainsMono Nerd Font" style=Medium
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        0 10 0 10 
hide_window_decorations     no
background_opacity          1
dynamic_background_opacity  yes
confirm_os_window_close     0
mouse_hide_wait             3.0
transparent_background_colors #010101@0.9
# Use meta + left-click drag to drag windows the there's
# no window decorations(border, title bar) 
hide_window_decorations     yes
# Animated cursor follows text
cursor_trail 1
# selection_foreground        none
# selection_background        none
# Include wallpaper colors
# include colors-matugen.conf

# Theme and dynamic font state
include active-look.conf 

# Tab bar
tab_bar_margin_height 0.0 0.0
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_title_template " {index} {title} "
# tab_bar_background none

  +---------------+
 /|   KEYMAPS    /|
/ |             / |
*-+------------*  |
| |            |  |
| |            |  |
| +------------+--+
| /            | /
|/             |/
*--------------*

map ctrl+backspace send_text all \x1b\x7f
map ctrl+a combine : select_all : copy_
map ctrl+backspace send_text all \x1b\x7f
map ctrl+a combine : select_all : copy_to_clipboard

# Toggle opacity levels
map ctrl+shift+0 set_background_opacity 1
map ctrl+alt+0 set_background_opacity 0.7 
 
# New tab/window
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd

# Toggle theme and font weight (persists across sessions)
map ctrl+alt+1 launch --type=background sh -c 'printf "font_family JetBrains Mono Light\ninclude themes/toge-dark.conf\n" > /home/y/dotfiles/kitty/active-look.conf && kitty @ load-config'
map ctrl+alt+2 launch --type=background sh -c 'printf "font_family JetBrains Mono Medium\ninclude themes/toge-light.conf\n" > /home/y/dotfiles/kitty/active-look.conf && kitty @ load-config'

# Launch default session in a new OS window
map alt+s>m goto_session sessions/maple.session
map alt+s>d goto_session sessions/dotfiles.session
map alt+s>p goto_session sessions/plan.session
